name: Phone Line

# Puts the intake phone line, (800) 956-9876, on every claimant intake form,
# folded into the trouble note beside the submit button, and adds the
# scroll-margin rule that keeps the sticky header off the first field on a
# CTA landing.
#
# Dispatch only: run it from the Actions tab, read the dry-run summary in the
# log, then run again with apply = true. Nothing to type in the run dialog
# except the toggle.
#
# The script is idempotent, so a rerun on an already-swept tree is a no-op and
# reports zero pages changed. If the number changes, edit PHONE_DISPLAY and
# PHONE_TEL in add_phone_line.py and run with apply = true again.
#
# The commit does NOT carry [skip lastmod]. A phone number is visible content
# the reader did not have before, so lastmod should move on these pages. It
# does carry [skip ci] so the push does not fan out to the other sweeps; the
# sitemap job runs on the merge to main as usual.
#
# It also runs a dry run on the 1st of each month against staging. That run
# never writes anything; it fails on purpose when it finds a form without the
# line, which is how a newly built intake page gets caught. A clean month
# passes silently.

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes and commit (leave false for a dry run)'
        type: boolean
        default: false
      branch:
        description: 'Branch to commit to'
        type: string
        default: staging

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Scheduled runs carry no inputs, so fall back to the same default.
          ref: ${{ inputs.branch || 'staging' }}

      - name: Dry run
        run: python3 add_phone_line.py | tee /tmp/phone.log

      - name: Fail the monthly check if a form is missing the line
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if grep -q '^  0 pages would change' /tmp/phone.log; then
            echo "Every claimant intake form carries the phone line."
            exit 0
          fi
          echo "::error::Intake forms are missing the phone line. Run this workflow with apply = true on staging."
          sed -n '1,6p' /tmp/phone.log
          exit 1

      - name: Apply
        if: ${{ inputs.apply }}
        run: python3 add_phone_line.py --apply

      - name: Commit
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git add '*.html'
          git commit -m "Add intake phone line to claimant forms [skip ci]"
          git pull --rebase
          git push
