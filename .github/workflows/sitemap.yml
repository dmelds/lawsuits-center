name: Generate sitemap

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate sitemap
        run: python generate-sitemap.py

      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet sitemap.xml; then
            git add sitemap.xml
            git commit -m "Auto-update sitemap.xml [skip ci]"
            BRANCH="$(git branch --show-current)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto remote and retrying"
            git pull --rebase origin "$BRANCH" || exit 1
            sleep $((attempt * 3))
          done
          echo "Push still failing after 5 attempts"
          exit 1
          else
            echo "No sitemap changes."
          fi
