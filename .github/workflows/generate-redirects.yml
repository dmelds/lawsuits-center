name: Generate Redirects

on:
  # Auto: runs when pages change on main. The job only commits _redirects
  # (not an .html file), so it never re-triggers itself.
  push:
    branches: [main]
    paths: ['**.html']
  # Manual: same dry-run option as the other workflows.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no commit)'
        type: boolean
        default: false

concurrency:
  group: repo-writes
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  generate-redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generate redirects
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python generate_redirects.py --dry-run
          else
            python generate_redirects.py
          fi

      - name: Commit and push changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit (_redirects already up to date)"
            exit 0
          fi
          git add _redirects
          git commit -m "Auto-regenerate forced .html redirects (_redirects)"
          BRANCH="$(git branch --show-current)"
          git pull --rebase origin "$BRANCH"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto remote and retrying"
            git pull --rebase origin "$BRANCH" || exit 1
            sleep $((attempt * 3))
          done
          echo "Push still failing after 5 attempts"
          exit 1
