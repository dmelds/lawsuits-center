name: Footer Legal Text

# Replaces the footer disclosure block on every page with the attorney-practice
# wording, English and Spanish. inline_footer.py does not re-sync pages that
# already carry an inline footer, so footer.html alone reaches nothing; this
# sweep edits each page.
#
# Dispatch only: run it from the Actions tab, read the dry-run summary in the
# log, then run again with apply = true. The branch input defaults to main,
# like inline-footer.yml, because Center's staging sits behind main.
#
# The script is idempotent, so a rerun on an already-swept tree is a no-op and
# reports zero pages changed. If the wording changes again, move NEW_EN and
# NEW_ES into OLD_EN and OLD_ES in set_footer_legal.py, write the new texts,
# and run with apply = true again.
#
# The commit does NOT carry [skip lastmod]: the wording is visible content the
# reader did not have before. It does carry [skip ci] so the push does not fan
# out to the other sweeps; the sitemap job runs on the merge to main.
#
# It also runs a dry run on the 1st of each month. That run never writes
# anything; it fails on purpose when it finds a page with the old wording,
# which is how a page built from a stale donor gets caught. A clean month
# passes silently.

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes and commit (leave false for a dry run)'
        type: boolean
        default: false
      branch:
        description: 'Branch to commit to'
        type: string
        default: main

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Dry run
        run: python3 set_footer_legal.py | tee /tmp/footer.log

      - name: Fail the monthly check if a page carries the old wording
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if grep -q '^  0 pages would change' /tmp/footer.log; then
            echo "Every page carries the current footer disclosure."
            exit 0
          fi
          echo "::error::Pages still carry the old footer disclosure. Run this workflow with apply = true on main."
          sed -n '1,6p' /tmp/footer.log
          exit 1

      - name: Apply
        if: ${{ inputs.apply }}
        run: python3 set_footer_legal.py --apply

      - name: Commit
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git add '*.html'
          git commit -m "Update footer disclosure to attorney-practice wording [skip ci]"
          git pull --rebase
          git push
