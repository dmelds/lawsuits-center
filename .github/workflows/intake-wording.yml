name: Intake Wording

# Replaces the platform wording on the intake pages and a handful of topical
# pages with the attorney-practice wording: David Meldofsky, a California
# attorney, refers each case review request to a participating law firm. The
# footer, how-case-review-works and the disclosure pages were rewritten by
# hand; this sweep covers the sentences the 35 intake pages share from their
# donors, wherever they appear.
#
# Dispatch only: run it from the Actions tab, read the dry-run summary in the
# log, then run again with apply = true. The branch input defaults to main,
# like inline-footer.yml, because Center's staging sits behind main.
#
# The script is idempotent, so a rerun on an already-swept tree is a no-op and
# reports zero pages changed. A new intake page built from an old donor is
# caught by the monthly dry run, which fails when any page still matches an
# old sentence.
#
# The commit does NOT carry [skip lastmod]: the wording is visible content the
# reader did not have before. It does carry [skip ci] so the push does not fan
# out to the other sweeps; the sitemap job runs on the merge to main.

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes and commit (leave false for a dry run)'
        type: boolean
        default: false
      branch:
        description: 'Branch to commit to'
        type: string
        default: main

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Dry run
        run: python3 set_intake_wording.py | tee /tmp/intake.log

      - name: Fail the monthly check if a page carries the old wording
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if grep -q '^  0 pages would change' /tmp/intake.log; then
            echo "Every page carries the current intake wording."
            exit 0
          fi
          echo "::error::Pages still carry the old intake wording. Run this workflow with apply = true on main."
          sed -n '1,6p' /tmp/intake.log
          exit 1

      - name: Apply
        if: ${{ inputs.apply }}
        run: python3 set_intake_wording.py --apply

      - name: Commit
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git add '*.html'
          git commit -m "Update intake pages to attorney-practice wording [skip ci]"
          git pull --rebase
          git push
