# Lawsuit Center. Build skip rule plus functions. The publish directory stays as set in the
# Netlify UI (site root), so this file changes nothing about how the HTML deploys.
#
# Skip the Netlify build when a push changes only repo tooling: checker and generator scripts
# (.py), notes (.md), SQL, and GitHub workflow files. Any change to a served file (HTML, CSS,
# JS, images, feed.xml, sitemap.xml, _redirects, _headers, functions) still builds.
# A manual "Retry deploy" (same commit as last build) and a first build always run.
[build]
  ignore = '''[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ':(exclude)*.py' ':(exclude)*.md' ':(exclude)*.sql' ':(exclude).github/' '''

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
